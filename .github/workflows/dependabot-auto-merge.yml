name: Dependabot auto-merge

# Dependabot の PR は fork 扱いとなり pull_request では読み取り専用トークンしか
# 得られないため、base ブランチの文脈で動く pull_request_target を使う。
# PR のコードは checkout せず、マージ操作しか行わないため未検証コードは実行されない。
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 自動マージの対象:
      #   - github-actions: すべて (SHA 固定の追従)
      #   - npm: patch はすべて、minor は devDependencies のみ
      # グループ PR は本番依存の minor と dev 依存の patch が混在するため、
      # update-type 等の集約出力ではなく依存ごとに判定し、全件が条件を満たす場合のみ対象にする。
      # major と本番依存の minor は CI で検知しにくい挙動変更を含みうるためレビューを通す。
      - name: Decide eligibility
        id: decide
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DEPS: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          if [ "$ECOSYSTEM" = "github_actions" ]; then
            eligible=true
          elif [ "$ECOSYSTEM" = "npm_and_yarn" ]; then
            eligible=$(echo "$DEPS" | jq 'length > 0 and all(
              .updateType == "version-update:semver-patch"
              or (.updateType == "version-update:semver-minor" and .dependencyType == "direct:development")
            )')
          else
            eligible=false
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.decide.outputs.eligible == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
