name: Dependabot auto-merge

# Dependabot の PR は fork 扱いとなり pull_request では読み取り専用トークンしか
# 得られないため、base ブランチの文脈で動く pull_request_target を使う。
# PR のコードは checkout せず、マージ操作しか行わないため未検証コードは実行されない。
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 対象は github-actions の SHA 更新のみに限定する。
      # 将来 npm 等のエコシステムを dependabot.yml に追加しても自動マージはされない。
      - name: Enable auto-merge
        if: steps.metadata.outputs.package-ecosystem == 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
