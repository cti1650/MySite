pre-commit:
  parallel: true
  commands:
    biome:
      glob: '*.{js,jsx,ts,tsx,json,css}'
      run: npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    secretlint:
      run: npx secretlint --maskSecrets --secretlintignore .gitignore {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: npm run typecheck
    lint:
      run: npm run lint
    test:
      run: npm test
    secretlint:
      run: git ls-files -z | xargs -0 npx secretlint --maskSecrets --secretlintignore .gitignore
    audit:
      run: npm audit --audit-level=high
